<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zeroz4j Application</title>

    <!--
        The stylesheet. ZeroZ Stack ships no CSS of its own: the components wear Tailwind and
        daisyUI class names, and this page is what supplies them. Without these two lines your
        application still works and looks like a 1994 web page.

        Both are pinned to an exact version, so your application cannot change appearance
        overnight because somebody else published something.

        Tailwind is doing its work here in the browser, as the page loads. That is right while you
        are building - nothing to install, nothing to run - and wrong for something you ship, where
        you build one finished stylesheet and serve that, so visitors download CSS instead of a
        compiler. `mvn install -Pproduction` does exactly that: it replaces everything between the
        two zeroz4j:styles comments below with a link to a finished, minified local stylesheet, in a
        copy of this page that the server serves in place of this one. Keep the two comments and keep
        the two tags between them; the production build fails if the comments are missing. Other
        stylesheets and scripts you add outside them stay as they are. See "A finished stylesheet for
        production" in docs/guides/packaging.md.

        Colours come from daisyUI's light and dark themes. Theme.start() in ClientApp keeps the
        visitor's choice (light, dark or system) as data-theme on the html element, and the server
        sets it from that choice before the page is drawn. Do not put data-theme on the body: it
        would override the one on html.
    -->
    <!-- zeroz4j:styles:begin -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.16"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.6.14/daisyui.css" rel="stylesheet" type="text/css" />
    <!-- zeroz4j:styles:end -->
</head>
<body class="bg-base-100 text-base-content min-h-screen m-0 p-0">
    <div id="app-root">Loading&hellip;</div>
    <script type="text/javascript" charset="utf-8" src="js/classes.js"></script>
    <script type="text/javascript">
        // TeaVM's JavaScript backend emits a UMD module that *exports* main rather than calling
        // it, so without this the bundle loads, defines everything, and does nothing: the page
        // sits on "Loading..." forever with HTTP 200, no JavaScript error and no WebSocket.
        // The typeof check matters as much as the call — it turns that silent case into a visible
        // one.
        (function () {
            var root = document.getElementById("app-root");
            function fail(msg) {
                root.textContent = "";
                var box = document.createElement("div");
                box.setAttribute("style",
                    "margin:2rem auto;max-width:40rem;padding:1rem 1.25rem;border-radius:8px;"
                    + "border:1px solid rgb(208,59,59);color:rgb(208,59,59);font:14px/1.5 system-ui,sans-serif");
                box.textContent = msg;
                root.appendChild(box);
            }

            if (typeof main !== "function") {
                fail("The application bundle did not load. Check that js/classes.js is served, "
                    + "and that the TeaVM compile ran (target/js/classes.js should exist).");
                return;
            }
            try {
                main();
            } catch (e) {
                console.error("Client start-up failed:", e);
                fail("The application failed to start — see the browser console.");
            }
        })();
    </script>
</body>
</html>
