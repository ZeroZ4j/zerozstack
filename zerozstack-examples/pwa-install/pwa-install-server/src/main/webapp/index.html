<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
        <title>zeroz4j PWA install</title>

        <!-- The three tags that make a page installable. Everything else is styling. -->
        <link rel="manifest" href="/manifest.webmanifest">
        <meta name="theme-color" content="#1f2937">
        <link rel="apple-touch-icon" href="/icons/icon-192.png">

        <script>
            // The example serves its manifest from an endpoint, so a query string on the page can
            // choose which identity to install under. A single-identity app links a static file and
            // needs none of this.
            if (window.location.search) {
                var link = document.querySelector('link[rel="manifest"]');
                link.href = '/manifest.webmanifest' + window.location.search;
            }
        </script>

        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = { corePlugins: { preflight: false } }
        </script>
        <link href="https://cdn.jsdelivr.net/npm/daisyui@5.6.14/daisyui.css" rel="stylesheet" type="text/css" />
    </head>
    <body class="bg-base-100 min-h-screen m-0 p-0 text-base-content" data-theme="dark">
        <div id="app-root"></div>
        <script type="text/javascript" charset="utf-8" src="/js/classes.js"></script>
        <script>
            main();
        </script>
    </body>
</html>
