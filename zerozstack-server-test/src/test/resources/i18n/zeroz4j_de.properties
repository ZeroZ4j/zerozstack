# The framework's own refusals in German, written by a deployment rather than by the framework.
#
# The framework now ships its own German, so this file is no longer how a deployment GETS German -
# it is how a deployment CHANGES it. Every sentence here is worded differently from the copy in
# zerozstack-shared-api on purpose, and OneServerTwoLanguagesTest asserts on this wording, so the
# test proves the override really takes effect rather than proving the framework's own file works.
#
# Two copies of i18n/zeroz4j_de.properties are therefore on this module's test classpath, and this
# one wins because target/test-classes comes before the dependency jars. That ordering is what makes
# an override an override, in a test and in a deployment alike.
#
# It must still have exactly the keys i18n/zeroz4j.properties has, with the same blanks in each -
# an override missing a key silently falls back to the framework's own wording for that one
# sentence. Nothing checked that until the drift check learned to look for a fallback outside the
# folder; this file was missing ui.language when it did, and that is how it was found.
#
# Written in UTF-8, umlauts and all, because that is what a translator types.

error.unexpected = Der Server konnte diese Anfrage nicht abschließen. Referenz: {0}
error.unknownService = Aufruf eines nicht registrierten Dienstes abgelehnt: {0}
error.unknownMethod = Keine Methode '{0}' im Dienst: {1}
error.authenticationRequired = Anmeldung erforderlich für: {0}#{1}
error.accessDenied = Zugriff verweigert: erfordert die Rolle {0}, vorhanden ist {1}
error.validationFailed = Prüfung fehlgeschlagen für {0}: {1}
error.unknownLazyHandle = Unbekannter oder nicht freigegebener Verweis: {0}

live.wrongType = Die Änderung gibt sich als {0} aus, benennt aber ein Objekt, das der Server als {1} führt. Es wurde nichts geändert.
live.notClientWritable = {0} ist nicht @ClientWritable
live.validationFailed = Prüfung fehlgeschlagen: {0}
live.requiresRole = Erfordert eine der Rollen {0}
live.nestedNotWritable = Die Änderung betrifft außerdem ein {0}, das Clients nicht schreiben dürfen. Es wurde nichts geändert.
live.nestedRequiresRole = Die Änderung betrifft außerdem ein {0}, wofür eine der Rollen {1} nötig ist. Es wurde nichts geändert.

# Worded differently from the framework's own "Sprache", so the override is visible on screen.
ui.language = Anzeigesprache
