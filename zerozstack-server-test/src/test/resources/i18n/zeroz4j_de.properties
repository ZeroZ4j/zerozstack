# The framework's own refusals in German, supplied the way an application supplies them: a file
# named i18n/zeroz4j_de.properties on the server's classpath. There is nothing to register, and
# nothing about the framework changes for a deployment that does not add this file.
#
# Written in UTF-8, umlauts and all, because that is what a translator types.

error.unexpected = Der Server konnte diese Anfrage nicht abschließen. Referenz: {0}
error.unknownService = Aufruf eines nicht registrierten Dienstes abgelehnt: {0}
error.unknownMethod = Keine Methode '{0}' im Dienst: {1}
error.authenticationRequired = Anmeldung erforderlich für: {0}#{1}
error.accessDenied = Zugriff verweigert: erfordert die Rolle {0}, vorhanden ist {1}
error.validationFailed = Prüfung fehlgeschlagen für {0}: {1}
error.unknownLazyHandle = Unbekannter oder nicht freigegebener Verweis: {0}

live.wrongType = Die Änderung gibt sich als {0} aus, benennt aber ein Objekt, das der Server als {1} führt. Es wurde nichts geändert.
live.notClientWritable = {0} ist nicht @ClientWritable
live.validationFailed = Prüfung fehlgeschlagen: {0}
live.requiresRole = Erfordert eine der Rollen {0}
live.nestedNotWritable = Die Änderung betrifft außerdem ein {0}, das Clients nicht schreiben dürfen. Es wurde nichts geändert.
live.nestedRequiresRole = Die Änderung betrifft außerdem ein {0}, wofür eine der Rollen {1} nötig ist. Es wurde nichts geändert.
