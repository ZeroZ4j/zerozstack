# The framework's own words, in German.
#
# The second language this project ships, and the only one besides English. German because it is
# the language the project's author writes, so this file can be reviewed rather than guessed at - a
# translation nobody can check is worse than one language, and shipping one would be a promise this
# project could not keep.
#
# It costs the browser nothing. Translated words travel over the connection, not in the bundle, so
# a build with this file and a build without it are byte-identical. What it costs is about 1.4 KB
# in one jar, and about the same on the wire once per connection for a reader who wants German.
#
# This file and i18n/zeroz4j.properties must have the same keys and the same blanks in each of
# them. FrameworkCatalogParityTest fails the build when they do not.

error.unexpected = Der Server konnte diese Anfrage nicht abschließen. Referenz: {0}
error.unknownService = RMI-Aufruf an nicht registrierten Dienst abgelehnt: {0}
error.unknownMethod = Keine Methode '{0}' im Dienst: {1}
error.authenticationRequired = Anmeldung erforderlich für: {0}#{1}
error.accessDenied = Zugriff verweigert: erfordert die Rolle {0}, der Benutzer hat {1}
error.validationFailed = Prüfung fehlgeschlagen für {0}: {1}
error.unknownLazyHandle = Unbekannter oder nicht freigegebener Verweis: {0}

live.wrongType = Die Änderung gibt sich als {0} aus, benennt aber ein Objekt, das der Server als {1} führt. Es wurde nichts geändert.
live.notClientWritable = {0} ist nicht @ClientWritable
live.validationFailed = Prüfung fehlgeschlagen: {0}
live.requiresRole = Erfordert eine der Rollen {0}
live.nestedNotWritable = Die Änderung betrifft auch ein {0}, das Clients nicht schreiben dürfen. Es wurde nichts geändert.
live.nestedRequiresRole = Die Änderung betrifft auch ein {0}, wofür eine der Rollen {1} nötig ist. Es wurde nichts geändert.

# Words on the framework's own controls.
ui.language = Sprache
