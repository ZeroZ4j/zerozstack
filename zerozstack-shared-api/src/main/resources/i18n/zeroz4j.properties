# The framework's own words, in English.
#
# This file and com.zeroz4j.api.i18n.FrameworkText must agree in both directions.
# FrameworkCatalogParityTest fails the build when they do not.
#
# To translate these, put i18n/zeroz4j_<language>.properties on the server's classpath - the
# application's own resources folder is the usual place. There is nothing to register.

error.unexpected = The server could not complete this request. Reference: {0}
error.unknownService = Rejected RMI call to unregistered service: {0}
error.unknownMethod = No method '{0}' on service: {1}
error.authenticationRequired = Authentication required for: {0}#{1}
error.accessDenied = Access denied: requires role {0} but user has {1}
error.validationFailed = Validation failed for {0}: {1}
error.unknownLazyHandle = Unknown or unauthorized lazy handle: {0}

live.wrongType = The change claims to be a {0} but names an object the server holds as a {1}. Nothing was changed.
live.notClientWritable = {0} is not @ClientWritable
live.validationFailed = Validation failed: {0}
live.requiresRole = Requires one of the roles {0}
live.nestedNotWritable = The change also alters a {0} that clients may not write. Nothing was changed.
live.nestedRequiresRole = The change also alters a {0}, which needs one of the roles {1}. Nothing was changed.

# Words on the framework's own controls.
ui.language = Language
